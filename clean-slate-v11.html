  const lastLine = lastLog ? 'Last session: ' + fmtDate(lastLog.date) + ' · Day ' + lastLog.session + ' (' + (daysSince(lastLog.date) === 0 ? 'today' : daysSince(lastLog.date) === 1 ? 'yesterday' : daysSince(lastLog.date) + ' days ago') + ')' : 'No sessions yet – first up is Day A.';

  return '<div class="home-head">' +
    '<div class="home-eyebrow"><span>Clean Slate · v11</span><span class="sync-dot' + (online?'':' offline') + '"></span></div>' +
    '<div class="home-title">RP<em>RECOMP.</em></div>' +
    '<div class="home-date">' + dateStr + '</div></div>' +
    '<div class="pad">' + rpDeloadOfferHtml(false) + rpPendingBanner() + banner +
    '<div class="section-head">Next session</div>' + card +
    '<div style="font-size:12px;color:var(--muted2);margin:-14px 0 26px">' + lastLine + '</div>' +
    '<div class="section-head">Block ' + pos.block + '</div><div class="week-strip" style="grid-template-columns:repeat(5,1fr)">' + weekChips + '</div>' +
    '<div class="section-head">Week ' + pos.week + '</div>' + dayRows +
    rpBonusHtml(pos.week) + '<div style="height:22px"></div>' + foodHomeHtml() +
    '<div class="section-head">Progress</div>' +
    '<div class="home-stats"><div class="hstat"><div class="hstat-val">' + logs.length + '</div><div class="hstat-label">Sessions</div></div>' +
    '<div class="hstat"><div class="hstat-val">' + pos.block + '</div><div class="hstat-label">Block</div></div>' +
    '<div class="hstat"><div class="hstat-val">' + pos.week + '</div><div class="hstat-label">Week</div></div></div></div>';
}

// ═══ RP SESSION ════════════════════════════════════════════
function rpStart() {
  if (!rpLive) {
    const block = RP.block, week = RP.week, session = rpNextSession();
    const planned = rpPlannedSets(week, RP.bonusSets);
    const logs = rpLogs();
    rpLive = { block: block, week: week, session: session, startedAt: new Date().toISOString(), ex: {} };
    rpSessionDef(session).exercises.forEach(function(ex) {
      const sug = rpSuggest(ex, block, week, logs);
      const rir = rpRir(ex, week);
      const sets = [];
      for (let i = 0; i < planned[ex.id]; i++) sets.push({ weight: sug.weight == null ? '' : String(sug.weight), reps: '', rir: String(rir.min), done: false });
      rpLive.ex[ex.id] = { skipped: false, sets: sets };
    });
    rpLiveSave();
  }
  nav('rpSession');
}

function vRPSession() {
  if (!rpLive) return '<div class="empty-note">No session in progress.</div>';
  const def = rpSessionDef(rpLive.session);
  const wk = rpWeek(rpLive.week);
  const logs = rpLogs();
  let html = '', i = 0;
  const exs = def.exercises;
  while (i < exs.length) {
    const ex = exs[i];
    if (ex.superset && exs[i + 1] && exs[i + 1].superset === ex.superset) {
      const b = exs[i + 1];
      html += '<div class="ss-pair"><div class="ss-tag-row">⚡ Superset ' + ex.order + ' + ' + b.order + ' – alternate, rest ' + fmtRest(b.rest) + ' after the pair</div>' +
        rpExCard(ex, logs) + rpExCard(b, logs) + '</div>';
      i += 2;
    } else { html += rpExCard(ex, logs); i++; }
  }
  const t = rpTotals();
  return '<div class="top-bar"><div class="back-btn" onclick="nav(\'home\')">←</div>' +
    '<div class="top-label" style="color:var(--accent)">Day ' + rpLive.session + '</div>' +
    '<div class="top-action" style="color:var(--muted2)" onclick="rpDiscard()">Discard</div></div>' +
    '<div class="pad" style="margin-bottom:14px"><div style="font-size:13px;color:var(--muted2);line-height:1.6">' + rpPosLabel(rpLive.block, rpLive.week, rpLive.session) +
    '<br>Target RIR <b style="color:var(--text);font-weight:500">' + wk.rir + '</b>' + (wk.compoundRir ? ' (compounds ' + wk.compoundRir + ')' : '') + ' · ' + esc(wk.guide) + '</div></div>' +
    (rpLive.week === 1 ? '<div class="rp-tip">Pick weights you could lift 3 more times.</div>' : '') +
    '<div class="ex-wrap">' + html + '</div>' +
    '<div style="height:150px"></div>' +
    '<div class="finish-bar"><div class="finish-prog" id="fprog">' + t.done + ' of ' + t.total + ' sets ticked</div>' +
    '<div class="finish-prog-bar"><div class="finish-prog-fill" id="fpf" style="width:' + t.pct + '%"></div></div>' +
    '<button class="finish-btn" id="fbtn" onclick="rpFinish()"' + (t.done === 0 ? ' disabled' : '') + '>' + rpFinishLabel(t) + '</button></div>';
}

function rpExCard(ex, logs) {
  const st = rpLive.ex[ex.id];
  const rir = rpRir(ex, rpLive.week);
  const sug = rpSuggest(ex, rpLive.block, rpLive.week, logs);
  const last = rpFindPerf(ex.id, logs);
  const allDone = !st.skipped && st.sets.length > 0 && st.sets.every(function(s){ return s.done; });
  const flagHtml = RP.flags && RP.flags[ex.id] ? '<div class="rp-line" style="color:var(--danger)">⚠ Joint pain flagged on ' + fmtDate(RP.flags[ex.id].date) + ' – consider a lighter load or a swap.</div>' : '';
  const lastHtml = flagHtml + (last ? '<div class="rp-line">Last time <span style="color:var(--muted)">(Wk ' + last.log.week + ', ' + fmtDate(last.log.date) + ')</span>: <b>' +
    last.sets.map(function(s){ return s.weight + ' × ' + s.reps; }).join(', ') + '</b></div>' : '<div class="rp-line">Last time: –</div>');
  const sugHtml = '<div class="rp-line">' + (sug.weight != null ? 'Suggested: <span class="sug">' + sug.weight + ' kg</span> · ' : '') + esc(sug.hint) + '</div>';
  const rows = st.sets.map(function(s, i) {
    const ph = last && last.sets[i] ? last.sets[i].reps : ex.reps[0] + '–' + ex.reps[1];
    return '<div class="rp-set' + (s.done ? ' logged' : '') + '" id="rps-' + ex.id + '-' + i + '">' +
      '<div class="rp-setno">' + (i + 1) + '</div>' +
      '<input id="rpw-' + ex.id + '-' + i + '" type="number" inputmode="decimal" step="0.5" min="0" placeholder="kg" value="' + esc(s.weight) + '" oninput="rpIn(\'' + ex.id + '\',' + i + ',\'weight\',this.value)">' +
      '<input id="rpr-' + ex.id + '-' + i + '" type="number" inputmode="numeric" min="0" placeholder="' + esc(ph) + '" value="' + esc(s.reps) + '" oninput="rpIn(\'' + ex.id + '\',' + i + ',\'reps\',this.value)">' +
      '<input type="number" inputmode="numeric" min="0" max="10" placeholder="' + esc(rir.label) + '" value="' + esc(s.rir) + '" oninput="rpIn(\'' + ex.id + '\',' + i + ',\'rir\',this.value)">' +
      '<button class="rp-tick" onclick="rpTick(\'' + ex.id + '\',' + i + ')">✓</button></div>';
  }).join('');
  const restTxt = ex.rest ? 'Rest ' + fmtRest(ex.rest) : 'No rest – straight into the next exercise';
  return '<div class="ex-card ex-open' + (allDone ? ' ex-done' : '') + (st.skipped ? ' rp-skipped' : '') + '" id="ec-' + ex.id + '">' +
    '<div class="ex-head" onclick="toggleEx(\'' + ex.id + '\')"><div class="ex-head-l">' +
    '<div class="ex-exname" style="white-space:normal"><span class="rp-ord">' + ex.order + '</span>' + esc(ex.name) +
    '<span class="rp-badge">' + ex.type + '</span>' + (ex.optional ? '<span class="rp-badge opt">Optional</span>' : '') + '</div>' +
    '<div class="ex-tmeta">' + ex.reps[0] + '–' + ex.reps[1] + ' reps · RIR ' + rir.label + ' · ' + restTxt + ' · ' + RP_MUSCLES[ex.muscle] + '</div></div>' +
    '<div style="display:flex;align-items:center;gap:8px"><span class="ex-done-badge">✓ Done</span><span class="ex-chev">▾</span></div></div>' +
    '<div class="ex-body">' +
    (st.skipped ? '<div class="rp-line">Skipped this session.</div>' :
      '<div class="ex-note">' + esc(ex.notes) + '</div>' + lastHtml + sugHtml +
      '<div class="rp-grid-head"><div>Set</div><div>kg</div><div>Reps</div><div>RIR</div><div></div></div>' + rows) +
    '<div class="rp-links">' + (st.skipped ? '<span></span>' : '<button class="rp-link accent" onclick="rpAddSet(\'' + ex.id + '\')">+ Add set</button>') +
    (ex.optional ? '<button class="rp-link" onclick="rpSkip(\'' + ex.id + '\')">' + (st.skipped ? 'Undo skip' : 'Skip exercise') + '</button>' : '') + '</div>' +
    '</div></div>';
}

function rpTotals() {
  let done = 0, total = 0;
  Object.keys(rpLive.ex).forEach(function(k) {
    if (rpLive.ex[k].skipped) return;
    rpLive.ex[k].sets.forEach(function(s){ total++; if (s.done) done++; });
  });
  return { done: done, total: total, pct: total ? Math.round(done / total * 100) : 0 };
}
function rpFinishLabel(t) { return t.done === 0 ? 'Tick a set to finish' : (t.done === t.total ? '✓ Finish Session' : 'Finish (' + t.pct + '%)'); }
function rpUpdateBar() {
  const t = rpTotals();
  const fb = document.getElementById('fbtn'), fp = document.getElementById('fprog'), ff = document.getElementById('fpf');
  if (fb) { fb.disabled = t.done === 0; fb.textContent = rpFinishLabel(t); }
  if (fp) fp.textContent = t.done + ' of ' + t.total + ' sets ticked';
  if (ff) ff.style.width = t.pct + '%';
}
function rpRefreshCard(exId) {
  const c = document.getElementById('ec-' + exId);
  const ex = rpExDef(exId);
  if (!c || !ex) return;
  const open = c.classList.contains('ex-open');
  c.outerHTML = rpExCard(ex, rpLogs());
  if (!open) document.getElementById('ec-' + exId).classList.remove('ex-open');
  rpUpdateBar();
}

// every input autosaves; a new weight flows down to later unticked sets that matched
function rpIn(exId, i, field, val) {
  const sets = rpLive.ex[exId].sets;
  if (field === 'weight') {
    const old = sets[i].weight;
    for (let j = i + 1; j < sets.length; j++) {
      if (!sets[j].done && sets[j].weight === old) {
        sets[j].weight = val;
        const inp = document.getElementById('rpw-' + exId + '-' + j);
        if (inp) inp.value = val;
      }
    }
  }
  sets[i][field] = val;
  rpLiveSave();
}

function rpTick(exId, i) {
  const s = rpLive.ex[exId].sets[i];
  const ex = rpExDef(exId);
  if (!s.done && (s.reps === '' || isNaN(parseFloat(s.reps)))) {
    toast('Enter reps first');
    const r = document.getElementById('rpr-' + exId + '-' + i); if (r) r.focus();
    return;
  }
  s.done = !s.done;
  rpLiveSave();
  const row = document.getElementById('rps-' + exId + '-' + i);
  if (row) row.classList.toggle('logged', s.done);
  const card = document.getElementById('ec-' + exId);
  if (card) card.classList.toggle('ex-done', rpLive.ex[exId].sets.every(function(x){ return x.done; }));
  rpUpdateBar();
  if (s.done) {
    vibrate(20);
    if (ex.rest) startTimer(ex.rest, ex.name);
    else { stopTimer(); toast('Straight into ' + ex.order.replace('a', 'b')); }
  } else stopTimer();
}

function rpAddSet(exId) {
  const sets = rpLive.ex[exId].sets;
  const prev = sets[sets.length - 1];
  const ex = rpExDef(exId);
  sets.push({ weight: prev ? prev.weight : '', reps: '', rir: prev ? prev.rir : String(rpRir(ex, rpLive.week).min), done: false });
  rpLiveSave();
  rpRefreshCard(exId);
}

function rpSkip(exId) {
  rpLive.ex[exId].skipped = !rpLive.ex[exId].skipped;
  rpLiveSave();
  rpRefreshCard(exId);
}

function rpDiscard() {
  if (!confirm('Discard this session? Anything entered will be lost.')) return;
  stopTimer();
  rpLive = null; rpLiveSave();
  nav('home');
}

function rpNum(v, half) {
  const n = parseFloat(v);
  if (isNaN(n)) return null;
  return half ? Math.round(n * 2) / 2 : n;
}

function rpFinish() {
  const t = rpTotals();
  if (t.done === 0) return;
  const left = t.total - t.done;
  if (left > 0 && !confirm(left + ' set' + (left === 1 ? '' : 's') + ' not ticked – ' + (left === 1 ? 'it' : 'they') + '\'ll be saved as skipped. Finish Day ' + rpLive.session + '?')) return;
  stopTimer();
  const def = rpSessionDef(rpLive.session);
  const sets = [], skipped = [], summary = [];
  def.exercises.forEach(function(ex) {
    const st = rpLive.ex[ex.id];
    if (st.skipped) skipped.push(ex.id);
    let n = 0;
    st.sets.forEach(function(s) {
      const done = !st.skipped && s.done;
      if (done) n++;
      sets.push({ exercise: ex.id, weight: rpNum(s.weight, true), reps: rpNum(s.reps), rir: rpNum(s.rir), done: done });
    });
    summary.push({ name: ex.name, done: n, total: st.sets.length, skipped: st.skipped });
  });
  const log = { id: Date.now(), date: todayKey(), program: RP_ID, block: rpLive.block, week: rpLive.week, session: rpLive.session,
    startedAt: rpLive.startedAt, finishedAt: new Date().toISOString(), sets: sets, skipped: skipped, feedback: null };
  const logs = rpLogs();
  logs.push(log);
  localStorage.setItem(RP_LOGS_KEY, JSON.stringify(logs));

  // advance: A → B → C; completing C advances the week; week 5 rolls into a new block
  RP.block = log.block; RP.week = log.week;
  RP.lastCompletedSession = log.session;
  RP.lastSessionDate = log.date;
  if (log.session === 'C') {
    RP.week++;
    if (RP.week > RP_PROGRAM.blockLength) {
      RP.week = 1; RP.block++;
      Object.keys(RP.bonusSets).forEach(function(m){ RP.bonusSets[m] = 0; });
    }
  }
  RP.deloadOffer = rpCheckEarlyDeload(log, logs) ? log.id : null;
  const wantFeedback = !rpWeek(log.week).deload;
  if (wantFeedback) RP.pendingFeedback = log.id;
  rpSave();
  rpLive = null; rpLiveSave();
  bumpStats();
  DB.sessions = null;
  if (wantFeedback) { rpFbDraft = null; nav('rpFeedback', { logId: log.id }); }
  else { rpBackupLog(log); rpShowDone(log, null); }
}

function rpShowDone(log, weekChanges) {
  const summary = rpSessionDef(log.session).exercises.map(function(ex) {
    const sets = log.sets.filter(function(s){ return s.exercise === ex.id; });
    return { name: ex.name, done: sets.filter(function(s){ return s.done; }).length, total: sets.length, skipped: (log.skipped || []).indexOf(ex.id) >= 0 };
  });
  const list = summary.map(function(s) {
    const chg = s.skipped ? '<span class="prog-chg pc-hold">skipped</span>' :
      '<span class="prog-chg ' + (s.done === s.total ? 'pc-rep' : 'pc-hold') + '">' + s.done + '/' + s.total + ' sets</span>';
    return '<div class="prog-item"><div class="prog-name">' + esc(s.name) + '</div>' + chg + '</div>';
  }).join('');
  const wkNote = log.session === 'C' ? (RP.week === 1 ? 'Block ' + log.block + ' complete – new block starts at week 1.' : 'Week ' + log.week + ' complete – week ' + RP.week + ' is RIR ' + rpWeek(RP.week).rir + '.') : '';
  document.getElementById('modal-inner').innerHTML = '<div class="modal-title">Day ' + log.session + ' Done 💪</div>' +
    '<div class="modal-sub">' + (wkNote ? wkNote + '<br>' : '') + 'Next: ' + rpPosLabel(RP.block, RP.week, rpNextSession()) + '</div>' +
    '<div id="deload-offer">' + rpDeloadOfferHtml(true) + '</div>' +
    (weekChanges ? rpWeekChangesHtml(weekChanges) : '') + list +
    '<button class="modal-btn" onclick="closeModal()">Back to Home</button>';
  document.getElementById('modal').classList.add('open');
}

// ── rp: history ────────────────────────────────────────────
function rpHistoryRecords() {
  return rpLogs().map(function(l) {
    return { fields: { Date: l.date, WorkoutName: 'RP · Week ' + l.week + ' · Day ' + l.session + (l.block > 1 ? ' · Block ' + l.block : '') }, rp: l };
  });
}
function rpHistBody(l) {
  const def = rpSessionDef(l.session);
  return def.exercises.map(function(ex) {
    const sets = l.sets.filter(function(s){ return s.exercise === ex.id; });
    if (!sets.length) return '';
    const done = sets.filter(function(s){ return s.done; });
    const missed = sets.length - done.length;
    const txt = (l.skipped || []).indexOf(ex.id) >= 0 ? 'skipped' :
      done.map(function(s){ return s.weight + '×' + s.reps + (s.rir != null ? ' @' + s.rir : ''); }).join(' · ') + (missed ? (done.length ? ' · ' : '') + missed + ' skipped' : '');
    return '<div class="hlog-row"><div class="hlog-name">' + esc(ex.name) + '</div><div class="hlog-sets wrap">' + txt + '</div></div>';
  }).join('') + (l.feedback ? Object.keys(l.feedback).map(function(m) {
    const f = l.feedback[m];
    return '<div class="hlog-row"><div class="hlog-name" style="color:var(--muted2)">' + RP_MUSCLES[m] + ' feedback</div><div class="hlog-sets wrap">' +
      RP_SORENESS[f.soreness] + ' · pump ' + f.pump + ' · workload ' + f.workload + (f.jointPain ? ' · joint pain' : '') + ' → ' + rpDeltaLabel(f.delta) + '</div></div>';
  }).join('') : '') + '<button class="rp-link accent" onclick="nav(\'rpEdit\',{logId:' + l.id + '})">✎ Edit or delete session</button>';
}

// ═══ RP FEEDBACK (v2) ══════════════════════════════════════
// After each non-deload session: per muscle trained, soreness coming in,
// pump, workload and joint pain → a set delta. At the end of the week the
// lowest delta per muscle adjusts that muscle's bonusSets (−1…+2).
const RP_SORENESS = { healedEarly: 'Healed early', justInTime: 'Just in time', stillSore: 'Still sore' };
let rpFbDraft = null;

function rpLogById(id) { return rpLogs().find(function(l){ return l.id === id; }); }
// muscles with at least one done set this session, in session order
function rpMusclesIn(log) {
  const out = [];
  rpSessionDef(log.session).exercises.forEach(function(ex) {
    const done = log.sets.some(function(s){ return s.exercise === ex.id && s.done; });
    if (done && out.indexOf(ex.muscle) < 0) out.push(ex.muscle);
  });
  return out;
}
// did any of this muscle's exercises fall short of last time's reps at the same weight?
// did this exercise get fewer reps than last time on sets at the same weight?
function rpExFellShort(log, exId, prior) {
  const now = log.sets.filter(function(s){ return s.exercise === exId && s.done && s.reps != null; });
  const prev = rpFindPerf(exId, prior);
  if (!now.length || !prev) return false;
  let a = 0, b = 0, pairs = 0;
  for (let i = 0; i < Math.min(now.length, prev.sets.length); i++) {
    if (now[i].weight !== prev.sets[i].weight) continue;
    a += now[i].reps; b += prev.sets[i].reps; pairs++;
  }
  return pairs > 0 && a < b;
}
function rpPriorLogs(log, logs) { return (logs || rpLogs()).filter(function(l){ return l.id < log.id; }); }
function rpRepsDropped(log, muscle) {
  const prior = rpPriorLogs(log);
  return rpSessionDef(log.session).exercises.some(function(ex) {
    return ex.muscle === muscle && rpExFellShort(log, ex.id, prior);
  });
}

// ── rp: early deload ───────────────────────────────────────
// A session "fell short" when more than half of the exercises performed got
// fewer reps than last time at the same weight. Two in a row → offer deload.
function rpSessionFellShort(log, logs) {
  const prior = rpPriorLogs(log, logs);
  const done = rpSessionDef(log.session).exercises.filter(function(ex) {
    return log.sets.some(function(s){ return s.exercise === ex.id && s.done; });
  });
  if (!done.length) return false;
  const short = done.filter(function(ex){ return rpExFellShort(log, ex.id, prior); }).length;
  return short > done.length / 2;
}
function rpCheckEarlyDeload(log, logs) {
  if (rpWeek(log.week).deload || rpWeek(RP.week).deload) return false;
  const i = logs.findIndex(function(l){ return l.id === log.id; });
  const prev = i > 0 ? logs[i - 1] : null;
  if (!prev || rpWeek(prev.week).deload) return false;
  return rpSessionFellShort(log, logs) && rpSessionFellShort(prev, logs);
}
function rpDeloadOfferHtml(inModal) {
  if (!RP.deloadOffer || rpWeek(RP.week).deload) return '';
  return '<div class="rp-banner"' + (inModal ? ' style="margin:0 0 14px"' : '') + '><div class="rp-banner-t"><b style="font-weight:500">Take your deload now?</b><br>' +
    'Most exercises fell short of last time\'s reps in your last two sessions – a sign fatigue is outrunning recovery.</div>' +
    '<div class="rp-banner-btns"><button class="rp-btn primary" onclick="rpAcceptDeload()">Deload now</button><button class="rp-btn" onclick="rpDismissDeload()">Not yet</button></div></div>';
}
function rpAcceptDeload() {
  RP.week = RP_PROGRAM.blockLength;
  RP.lastCompletedSession = null;
  RP.deloadOffer = null;
  rpSave();
  document.getElementById('modal').classList.remove('open');
  toast('Deload week starts with Day A');
  nav('home');
}
function rpDismissDeload() {
  RP.deloadOffer = null;
  rpSave();
  if (document.getElementById('modal').classList.contains('open')) document.getElementById('deload-offer').innerHTML = '';
  else render();
}
function rpDelta(f, dropped) {
  if (f.jointPain) return 0;
  if (f.soreness === 'stillSore') return dropped ? -1 : 0;
  if (f.soreness === 'justInTime') return 0;
  return f.workload === 3 ? 0 : 1;   // healed early
}
function rpDeltaLabel(d) { return d > 0 ? '+' + d + ' set' : d < 0 ? '−' + Math.abs(d) + ' set' : 'hold'; }

function vRPFeedback() {
  const log = rpLogById(ctx.logId);
  if (!log) return '<div class="empty-note">Session not found.</div>';
  const muscles = rpMusclesIn(log);
  if (!rpFbDraft || rpFbDraft.logId !== log.id) {
    rpFbDraft = { logId: log.id, m: {} };
    muscles.forEach(function(m){ rpFbDraft.m[m] = { soreness: 'justInTime', pump: 2, workload: 2, jointPain: false }; });
  }
  const cards = muscles.map(function(m) {
    const exs = rpSessionDef(log.session).exercises.filter(function(e){ return e.muscle === m; }).map(function(e){ return e.name; });
    return '<div class="fb-card" id="fb-' + m + '">' + rpFbCardInner(log, m, exs) + '</div>';
  }).join('');
  return '<div class="top-bar"><div class="top-label" style="color:var(--accent)">Day ' + log.session + ' Feedback</div>' +
    '<div class="top-action" style="color:var(--muted2)" onclick="rpSaveFeedback(true)">Skip</div></div>' +
    '<div class="pad" style="margin-bottom:14px"><div style="font-size:13px;color:var(--muted2);line-height:1.6">' + rpPosLabel(log.block, log.week, log.session) +

// save (or skip) feedback for a log; completing Day C applies the week's deltas
function rpSaveFeedback(skip, logId) {
  const id = logId || (rpFbDraft && rpFbDraft.logId) || ctx.logId;
  const logs = rpLogs();
  const log = logs.find(function(l){ return l.id === id; });
  if (!log) return;
  if (!skip && rpFbDraft && rpFbDraft.logId === id) {
    const fb = {};
    Object.keys(rpFbDraft.m).forEach(function(m) {
      const f = rpFbDraft.m[m], dropped = rpRepsDropped(log, m);
      fb[m] = { soreness: f.soreness, pump: f.pump, workload: f.workload, jointPain: f.jointPain, repsDropped: dropped, delta: rpDelta(f, dropped) };
      // joint pain flags this muscle's exercises from the session; a pain-free report clears them
      rpSessionDef(log.session).exercises.forEach(function(ex) {
        if (ex.muscle !== m) return;
        if (f.jointPain) RP.flags[ex.id] = { date: log.date };
        else delete RP.flags[ex.id];
      });
    });
    log.feedback = fb;
    localStorage.setItem(RP_LOGS_KEY, JSON.stringify(logs));
  }
  if (RP.pendingFeedback === id) RP.pendingFeedback = null;
  const changes = log.session === 'C' ? rpApplyWeek(log, logs) : null;
  rpSave();
  rpBackupLog(log);
  rpFbDraft = null;
  if (view === 'rpFeedback') rpShowDone(log, changes);
  else { render(); if (changes) toast('Next week\'s sets updated'); }
}

// lowest delta per muscle across the week's sessions → bonusSets, clamped −1…+2
function rpApplyWeek(cLog, logs) {
  if (rpWeek(cLog.week).deload) return null;
  // a block rollover already reset bonus sets; nothing to carry
  if (RP.block !== cLog.block) return null;
  const week = logs.filter(function(l){ return l.block === cLog.block && l.week === cLog.week && l.feedback; });
  const changes = [];
  Object.keys(RP_MUSCLES).forEach(function(m) {
    const ds = week.filter(function(l){ return l.feedback[m]; }).map(function(l){ return l.feedback[m].delta; });
    if (!ds.length) return;
    const d = Math.min.apply(null, ds);
    const before = RP.bonusSets[m] || 0;
    const after = Math.max(-1, Math.min(2, before + d));
    RP.bonusSets[m] = after;
    if (after !== before) changes.push({ muscle: m, from: before, to: after });
  });
  return changes;
}

  if (!changes.length) return '<div class="rp-line" style="margin:0 0 12px">Volume holds steady next week.</div>';

// ═══ RP AIRTABLE BACKUP ════════════════════════════════════
// Each closed RP session is POSTed to the existing Sessions table (Kind
// "lift") with Log = {"rp": <log>, "state": <RP state after it>}. On load,
// logs missing on either side are synced: local-only ones are uploaded,
// remote-only ones restored. A fresh device also restores its position.
const RP_SYNCED_KEY = 'cleanslate_rp_synced';
let rpSyncing = false;
function rpSynced() { return loadJSON(RP_SYNCED_KEY) || []; }
function rpMarkSynced(ids) {
  const s = rpSynced();
  ids.forEach(function(id){ if (s.indexOf(id) < 0) s.push(id); });
  localStorage.setItem(RP_SYNCED_KEY, JSON.stringify(s));
}
function rpParseRemote(rec) {
  if (!rec || !rec.fields || !rec.fields.Log || rec.fields.Log.indexOf('"rp"') < 0) return null;
  try { const o = JSON.parse(rec.fields.Log); return o && o.rp && o.rp.id ? o : null; } catch (e) { return null; }
}
function rpBackupRecord(log) {
  const state = Object.assign({}, RP);
  return { fields: { Date: log.date, WorkoutName: 'RP · Week ' + log.week + ' · Day ' + log.session + (log.block > 1 ? ' · Block ' + log.block : ''),
    Kind: 'lift', Log: JSON.stringify({ rp: log, state: state }) } };
}
// writeThrough with critical=true either saves or queues for retry, so the log counts as backed up
async function rpBackupLog(log) {
  if (!log || rpSynced().indexOf(log.id) >= 0) return;
  rpMarkSynced([log.id]);
  await writeThrough('/sessions', 'POST', { records: [rpBackupRecord(log)] }, true);
}
let rpSyncAgain = false;
async function rpSync(loud) {
  if (rpSyncing) { rpSyncAgain = true; return; }
  rpSyncing = true;
  try {
    const remote = await atList('sessions');
    DB.sessions = remote;
    const deleted = rpDeleted();
    const all = remote.map(function(rec){ const o = rpParseRemote(rec); if (o) o.recId = rec.id; return o; }).filter(Boolean);
    // sessions deleted on this phone: remove the Airtable copy too
    for (const r of all.filter(function(r){ return deleted.indexOf(r.rp.id) >= 0; })) {
      await writeThrough('/sessions?records[]=' + r.recId, 'DELETE', null, true);
    }
    const remoteLogs = all.filter(function(r){ return deleted.indexOf(r.rp.id) < 0; }).sort(function(a, b){ return a.rp.id - b.rp.id; });
    let logs = rpLogs();
    // edits: the higher revision wins in either direction
    let pulled = 0;
    for (const r of remoteLogs) {
      const i = logs.findIndex(function(l){ return l.id === r.rp.id; });
      if (i < 0) continue;
      const lr = logs[i].rev || 0, rr = r.rp.rev || 0;
      if (lr > rr) await writeThrough('/sessions', 'PATCH', { records: [{ id: r.recId, fields: { Log: JSON.stringify({ rp: logs[i], state: r.state }) } }] }, true);
      else if (rr > lr) { logs[i] = r.rp; pulled++; }
    }
    if (pulled) localStorage.setItem(RP_LOGS_KEY, JSON.stringify(logs));
    const localIds = logs.map(function(l){ return l.id; });
    const remoteIds = remoteLogs.map(function(r){ return r.rp.id; });
    // restore anything only Airtable has
    const missing = remoteLogs.filter(function(r){ return localIds.indexOf(r.rp.id) < 0; });
    if (missing.length) {
      const freshDevice = !logs.length && !rpLive;
      const merged = logs.concat(missing.map(function(r){ return r.rp; })).sort(function(a, b){ return a.id - b.id; });
      localStorage.setItem(RP_LOGS_KEY, JSON.stringify(merged));
      if (freshDevice) {
        const keep = RP.activeProgram;
        RP = Object.assign(rpDefaultState(), missing[missing.length - 1].state || {});
        RP.activeProgram = keep;
        RP.pendingFeedback = null; RP.deloadOffer = null;
        rpSave();
      }
      toast('Restored ' + missing.length + ' RP session' + (missing.length === 1 ? '' : 's') + ' from Airtable');
    }
    rpMarkSynced(remoteIds);
    const bkRestored = await bkSync(remote);
    // upload closed local logs Airtable doesn't have
    const synced = rpSynced();
    const toSend = logs.filter(function(l){ return remoteIds.indexOf(l.id) < 0 && synced.indexOf(l.id) < 0 && l.id !== RP.pendingFeedback; });
    for (const l of toSend) await rpBackupLog(l);
    if (loud) toast(toSend.length ? 'Backed up ' + toSend.length + ' session' + (toSend.length === 1 ? '' : 's') + ' ✓' : 'RP sessions already backed up ✓');
    localStorage.setItem('cleanslate_rp_lastsync', new Date().toISOString());
    if ((missing.length || pulled || bkRestored) && (view === 'home' || view === 'history' || view === 'manage' || view === 'week' || view === 'progress' || view === 'food' || view === 'foodLib')) render();
  } catch (e) {
    if (loud) toast('Offline – backup will run when you\'re back online');
  } finally {
    rpSyncing = false;
    if (rpSyncAgain) { rpSyncAgain = false; setTimeout(function(){ rpSync(); }, 0); }
    const st = document.getElementById('rp-sync-status');
    if (st) st.textContent = rpSyncStatus();
    const bs = document.getElementById('bk-sync-status');
    if (bs) bs.textContent = bkStatus();
  }
}
function rpSyncNow() { rpSync(true); }
const RP_DELETED_KEY = 'cleanslate_rp_deleted';
function rpDeleted() { return loadJSON(RP_DELETED_KEY) || []; }

function saveSyncKey() {

}
function rpEdIn(idx, field, val) { rpEditDraft.sets[idx][field] = val; }
function rpEdTick(idx) {
  const st = rpEditDraft.sets[idx];
  st.done = !st.done;
  const row = document.getElementById('ed-' + idx);
  if (row) row.classList.toggle('logged', st.done);
}
function rpEditSave() {
  const logs = rpLogs();
  const i = logs.findIndex(function(l){ return l.id === rpEditDraft.id; });
  if (i < 0) return;
  rpEditDraft.sets.forEach(function(st) {
    st.weight = rpNum(st.weight, true); st.reps = rpNum(st.reps); st.rir = rpNum(st.rir);
    if (st.done && st.reps == null) st.done = false;
  });
  rpEditDraft.rev = (logs[i].rev || 0) + 1;
  rpEditDraft.editedAt = new Date().toISOString();
  logs[i] = rpEditDraft;
  localStorage.setItem(RP_LOGS_KEY, JSON.stringify(logs));
  rpEditDraft = null;
  toast('Session updated ✓');
  nav('history');
  rpSync();
}
function rpEditDelete() {
  if (!confirm('Delete this session? Its sets stop counting towards suggestions. Your position stays where it is – change it in Manage if needed.')) return;
  const id = rpEditDraft.id;
  localStorage.setItem(RP_LOGS_KEY, JSON.stringify(rpLogs().filter(function(l){ return l.id !== id; })));
  const d = rpDeleted(); d.push(id); localStorage.setItem(RP_DELETED_KEY, JSON.stringify(d));
  if (RP.pendingFeedback === id) RP.pendingFeedback = null;
  if (RP.deloadOffer === id) RP.deloadOffer = null;
  rpSave();
  rpEditDraft = null;
  toast('Session deleted');
  nav('history');
  rpSync();
}

// ═══ RUN-STRENGTH + 800 m COMEBACK (v10) ═══════════════════
// A second localStorage programme alongside RP Recomp. The gym programme and
// the run plan are data (phases → sessions / weeks), so later phases slot in
// the same way. Gym logs, run logs, benchmarks and weigh-ins stay on this
// phone (no Airtable) – Manage → Backup exports them all.

// ── dates (local, ISO yyyy-mm-dd) ──────────────────────────
const WEEK_DAYS = ['Mon','Tue','Wed','Thu','Fri','Sat','Sun'];
const MONTHS = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
function isoOf(d) { return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0'); }
function dateOf(iso) { const p = iso.split('-'); return new Date(+p[0], +p[1] - 1, +p[2]); }
function addDays(iso, n) { const d = dateOf(iso); d.setDate(d.getDate() + n); return isoOf(d); }
function daysBetween(a, b) { return Math.round((dateOf(b) - dateOf(a)) / 86400000); }
function dayIdxOf(iso) { return (dateOf(iso).getDay() + 6) % 7; }   // Mon = 0
function mondayOf(iso) { return addDays(iso, -dayIdxOf(iso)); }
function fmtDay(iso) { const p = iso.split('-'); return WEEK_DAYS[dayIdxOf(iso)] + ' ' + parseInt(p[2], 10) + ' ' + MONTHS[parseInt(p[1], 10) - 1]; }
function fmtDur(sec) {
  if (sec == null || isNaN(sec)) return '';
  sec = Math.round(sec);
  const h = Math.floor(sec / 3600), m = Math.floor(sec % 3600 / 60), s = sec % 60;
  return (h ? h + ':' + String(m).padStart(2, '0') : m) + ':' + String(s).padStart(2, '0');
}
// "24:30", "1:02:10" or plain minutes "24" / "24.5"
function parseDur(txt) {
  txt = String(txt || '').trim();
  if (!txt) return null;
  if (txt.indexOf(':') >= 0) {
    const p = txt.split(':').map(function(x){ return parseInt(x, 10); });
    if (p.some(isNaN)) return null;
    return p.length === 3 ? p[0] * 3600 + p[1] * 60 + p[2] : p[0] * 60 + p[1];
  }
  const n = parseFloat(txt);
  return isNaN(n) ? null : Math.round(n * 60);
}
function fmtDist(m) { return m == null ? '–' : m >= 1000 ? (m / 1000) + ' km' : m + ' m'; }

// ── weekly schedule ────────────────────────────────────────

// ── plan maths ─────────────────────────────────────────────
// Calendar week n (1-based from the start date) minus the repeats chosen at
// or before it. A repeat therefore shifts everything after it, checkpoints
// included, without rewriting anything.
function planWeekFor(ws) {
  const st = runState();
  const cal = Math.floor(daysBetween(st.start, ws) / 7) + 1;
  if (cal < 1) return cal;
  return cal - st.repeats.filter(function(r){ return r <= ws; }).length;
}
function weekSlots(ws) { const s = runState().swaps[ws]; return Array.isArray(s) && s.length === 7 ? s : RS_WEEK; }
function runSessionFor(pw, slot) {
  const wk = RUN_WEEKS[pw - 1];
  if (!wk) return null;
  return { week: pw, session: (wk.slots && wk.slots[slot]) || wk.session, note: wk.note || '',
    checkpoint: wk.checkpoint && wk.checkpoint.slot === slot ? wk.checkpoint : null };
}
// last calendar week that maps to plan week pw, assuming no further repeats
function weekStartForPlanWeek(pw) {
  const st = runState();
  let found = null;
  for (let k = 0; k < 120; k++) {
    const ws = addDays(st.start, 7 * k), p = planWeekFor(ws);
    if (p === pw) found = ws;
    if (p > pw) break;
  }
  return found;
}
function checkpointDates() {
  return RUN_WEEKS.filter(function(w){ return w.checkpoint; }).map(function(w) {
    const ws = weekStartForPlanWeek(w.week);
    return { week: w.week, label: w.checkpoint.label, kind: w.checkpoint.kind, date: ws ? addDays(ws, weekSlots(ws).indexOf(w.checkpoint.slot)) : null };
  });
}
function runDesc(s) {
  if (!s) return '';
  const unit = function(sec){ return sec % 60 ? sec + ' s' : (sec / 60) + ' min'; };
  if (s.type === 'intervals') return unit(s.jog) + ' jog / ' + unit(s.walk) + ' walk × ' + s.reps;
  if (s.type === 'parkrun') return 'parkrun ' + fmtDist(s.distanceM) + ', steady';
  return (s.min[0] === s.min[1] ? s.min[0] : s.min[0] + '–' + s.min[1]) + ' min continuous' + (s.easy ? ', easy' : '') +
    (s.strides ? ' + ' + s.strides + ' × ' + STRIDE_SEC + ' s strides' : '');
}
function runTotalMin(s) {
  if (s.type === 'intervals') return Math.round((s.jog + s.walk) * s.reps / 60);
  if (s.type === 'continuous') return s.min[0] + (s.strides ? Math.round(s.strides * (STRIDE_SEC + STRIDE_EASY_SEC) / 60) : 0);
  return null;
}

// ── week status ────────────────────────────────────────────
function inWeek(date, ws) { const d = daysBetween(ws, date); return d >= 0 && d < 7; }
function slotLog(ws, slot) {
  const info = SLOT_INFO[slot];
  if (info.kind === 'gym') return rsLogs().filter(function(l){ return l.slot === slot && inWeek(l.date, ws); }).pop() || null;
  if (info.kind === 'run') return runLogs().filter(function(l){ return l.slot === slot && inWeek(l.date, ws); }).pop() || null;
  return null;
}
// status: done | partial | skipped | missed | today | upcoming | rest
function dayStatus(ws, i) {
  const slot = weekSlots(ws)[i], date = addDays(ws, i), today = todayKey(), info = SLOT_INFO[slot];
  const log = slotLog(ws, slot);
  let status;
  if (info.kind === 'rest') status = 'rest';
  else if (log) status = info.kind === 'gym' ? 'done' : (log.completed === 'yes' ? 'done' : log.completed === 'partial' ? 'partial' : 'skipped');
  else if (date < today) status = 'missed';
  else status = date === today ? 'today' : 'upcoming';
  const pw = planWeekFor(ws);
  const run = info.kind === 'run' ? runSessionFor(pw, slot) : null;
  return { slot: slot, date: date, status: status, log: log, info: info, run: run, planWeek: pw };
}
const STATUS_LABEL = { done: '✓ Done', partial: '◐ Partial', skipped: '✕ Skipped', missed: 'Missed', today: 'Today', upcoming: '', rest: '' };

// ── progression prompts ────────────────────────────────────
function runRepeatPrompt() {
  const st = runState(), ws = mondayOf(todayKey()), prev = addDays(ws, -7);
  if (st.decisions[ws] || runLive) return null;
  const ppw = planWeekFor(prev);
  if (ppw < 1 || ppw > RUN_WEEKS.length) return null;
  const logs = runLogs().filter(function(l){ return inWeek(l.date, prev) && /^run/.test(l.slot); });
  const done = {};
  logs.forEach(function(l){ if (l.completed === 'yes') done[l.slot] = 1; });
  const n = Object.keys(done).length;
  const calves = logs.some(function(l){ return l.calves === 'tight' || l.calves === 'sore'; });
  if (n >= 3 && !calves) return null;
  return { ws: ws, week: ppw, done: n, calves: calves };
}
function runDecide(repeat) {
  const o = runRepeatPrompt();
  if (!o) return;
  const st = runState();
  st.decisions[o.ws] = repeat ? 'repeat' : 'carry';
  if (repeat && st.repeats.indexOf(o.ws) < 0) st.repeats.push(o.ws);
  runStateSave(st);
  bkSoon();
  toast(repeat ? 'Repeating week ' + o.week + ' – checkpoints move back a week' : 'On to week ' + planWeekFor(o.ws));
  render();
}
function runSoreWarning() {
  const l = runLogs(), a = l[l.length - 1], b = l[l.length - 2];
  return !!(a && b && a.calves === 'sore' && b.calves === 'sore');
}
function runPromptsHtml() {
  const o = runRepeatPrompt();
  let html = '';
  if (o) {
    const why = [];
    if (o.done < 3) why.push(o.done + ' of 3 runs completed');
    if (o.calves) why.push('calves logged tight or sore');
    html += '<div class="rp-banner" id="repeat-prompt"><div class="rp-banner-t"><b>Repeat last week?</b><br>Week ' + o.week + ': ' + why.join(' · ') + '.</div>' +
      '<div class="rp-banner-btns"><button class="rp-btn primary" onclick="runDecide(true)">Repeat</button><button class="rp-btn" onclick="runDecide(false)">Carry on</button></div></div>';
  }
  return html;
}

  const today = todayKey(), cur = mondayOf(today);
  const off = ctx.off || 0, ws = addDays(cur, 7 * off), pw = planWeekFor(ws);
  const isCur = off === 0;
  const rows = WEEK_DAYS.map(function(name, i) {
    const s = dayStatus(ws, i);
    const cp = s.run && s.run.checkpoint;
    let detail = '';
    if (s.info.kind === 'gym') detail = RS_SESSION_NAMES[s.info.session];
    else if (s.info.kind === 'run') detail = s.planWeek < 1 ? 'Plan not started' : s.run ? runDesc(s.run.session) : 'Phase 1 complete';
    else detail = 'Full rest';

    const past = s.date < today;
    const startable = (isCur || past) && s.info.kind !== 'rest' && !s.log && !(s.info.kind === 'run' && !s.run);
    const col = s.info.kind === 'run' ? 'var(--cardio)' : s.info.kind === 'gym' ? 'var(--accent)' : 'var(--muted)';
    return '<div class="wk-row' + (s.date === today ? ' is-today' : '') + (cp ? ' is-cp' : '') + ' st-' + s.status + '" style="--wc:' + (cp ? 'var(--cp)' : col) + '">' +

      '<div class="wk-main"' + (startable ? ' onclick="weekOpen(' + i + ',' + off + ')" style="cursor:pointer"' : '') + '>' +
      '<div class="wk-slot">' + esc(s.info.label) + (cp ? ' <span class="cp-text">★ Checkpoint</span>' : '') + '</div>' +

function rsPhaseDef() { return RS_PROGRAM.phases.find(function(p){ return p.id === RS.phase; }) || RS_PROGRAM.phases[0]; }
function rsSessionDef(id) { return rsPhaseDef().sessions.find(function(s){ return s.id === id; }); }
function rsExDef(id) {

  return null;
}
// the exercise as done today: variant fields override the base exercise
function rsEff(ex, variantId) {

}
function rsInc(e) { return e.equip === 'db' ? (parseFloat(RS.dbStep) || 2.5) : (e.increment || 2.5); }
function rsCols(e) {

}
function rsTargetLabel(e) {

}
function rsFindPerf(e, logs) {

}
function rsSuggest(e, logs) {

    const tgt = last.sets[0].target || e.hold;
    const all = last.sets.every(function(s){ return s.sec >= tgt; });
    return all ? { target: tgt + 5, up: true, hint: '+5 s – you held ' + tgt + ' s on every set' } : { target: tgt, hint: 'Same hold – build to ' + tgt + ' s on every set' };
  }
  if (e.bodyweight) {
    if (e.max) return { hint: last ? 'Last time: ' + last.sets.map(function(s){ return s.reps; }).join(', ') + ' – beat one set' : 'Max reps each set, clean form' };
    return { hint: e.progression === 'lower' ? 'Bodyweight – stop with 2+ reps in reserve' : 'Bodyweight – slow and controlled' };
  }
  const inc = rsInc(e), top = e.reps[1];
  const range = e.reps[0] === top ? top + ' reps' : e.reps[0] + '–' + top + ' reps';
  if (!last) return { weight: null, hint: 'Find a weight for ' + range + (e.progression === 'lower' ? ' with 2+ reps in reserve' : '') };
  const wt = Math.max.apply(null, last.sets.map(function(s){ return s.weight || 0; }));
  const allTop = last.sets.every(function(s){ return s.reps >= top; });
  if (e.progression === 'lower') {
    const rirOk = last.sets.every(function(s){ return s.rir != null && s.rir >= 2; });
    if (allTop && rirOk) return { weight: round2(wt + inc), up: true, hint: '+' + inc + ' kg – every set hit ' + top + ' at RIR 2+' };

  }
  if (allTop) return { weight: round2(wt + inc), up: true, hint: '+' + inc + ' kg – you hit the top of the range last time' };

function rsNewSets(e, logs, n) {

// ═══ RUN TIMER ═════════════════════════════════════════════
// Runs off a stored start time (minus paused time), like the rest timer, so

let runLive = loadJSON(RUN_LIVE_KEY);

}

    segments: runSegments(p.r.session), startedAt: Date.now(), pausedAt: null, pausedMs: 0, lastIdx: 0 };

}

}

// ── cues ───────────────────────────────────────────────────
const CUE_TONES = {
  jog: [[660, 0, .16], [990, .2, .3]], run: [[660, 0, .16], [990, .2, .3]], go: [[660, 0, .16], [990, .2, .3]],
  stride: [[1200, 0, .09], [1200, .14, .09], [1200, .28, .09]],
  walk: [[440, 0, .4], [330, .48, .55]], easy: [[440, 0, .4], [330, .48, .55]],
  done: [[523, 0, .18], [659, .2, .18], [784, .4, .18], [1046, .6, .7]]
};
function cueAt(kind, at, bus) {
  (CUE_TONES[kind] || CUE_TONES.go).forEach(function(t) {
    const o = audioCtx.createOscillator(), g = audioCtx.createGain();
    o.frequency.value = t[0]; o.connect(g); g.connect(bus);
    const s = at + t[1];
    g.gain.setValueAtTime(0.0001, s); g.gain.exponentialRampToValueAtTime(0.35, s + 0.02); g.gain.exponentialRampToValueAtTime(0.0001, s + t[2]);
    o.start(s); o.stop(s + t[2] + 0.05);
  });
}
function cueNow(kind) { if (!audioCtx) return; try { cueAt(kind, audioCtx.currentTime + 0.05, audioCtx.destination); } catch (e) {} }

  runCancelCues();

  try {
    const bus = audioCtx.createGain(); bus.connect(audioCtx.destination); runCueBus = bus;
    const el = runElapsed(), now = audioCtx.currentTime;
    let t = 0;
    runLive.segments.forEach(function(s, i) {
      if (i > 0 && t > el + 0.1) cueAt(s.kind, now + (t - el), bus);
      t += s.sec;
    });
    if (t > el + 0.1) cueAt('done', now + (t - el), bus);
    // inaudible tone that keeps the context alive until the end
    const k = audioCtx.createOscillator(), kg = audioCtx.createGain();
    k.frequency.value = 30; kg.gain.value = 0.001; k.connect(kg); kg.connect(bus);

}
function wakeOff() { if (wakeLock) { try { wakeLock.release(); } catch (e) {} wakeLock = null; } }

});

// ═══ PROGRESS: phases, gates, benchmarks, weight ═══════════
function phase1Gate() {
  const logs = runLogs(), today = todayKey();
  const ran40 = logs.some(function(l) {

  });

// ═══ RUN-STRENGTH AIRTABLE BACKUP ══════════════════════════
// Gym sessions, runs, weigh-ins and benchmarks used to live only on the
// phone, so clearing the browser's site data lost them for good. Now they go
// to the Sessions table too, alongside the RP backups:
//   gym session → Kind "lift",   Log = {"rs": <log>}
//   run         → Kind "cardio", Log = {"run": <log>}
//   one record  → no Kind,       Log = {"body": {weights, benchmarks, runState, rsState}}
// Every sync (app start, coming back online, after each save) merges both
// ways: anything only Airtable has is restored, anything only this phone has
// is uploaded, and a log that differs is pushed from the phone. Deletions are
// remembered (cleanslate_bk_deleted) so a deleted item isn't restored.
const BK_DELETED_KEY = 'cleanslate_bk_deleted';
const BK_SENT_KEY = 'cleanslate_bk_sent';
const BK_LAST_KEY = 'cleanslate_bk_lastsync';
function bkDeleted() { return loadJSON(BK_DELETED_KEY) || []; }
function bkForget(key, at) {   // record a deletion on this phone
  const d = bkDeleted();
  if (d.indexOf(key) < 0) { d.push(key); localStorage.setItem(BK_DELETED_KEY, JSON.stringify(d)); }
  // weigh-ins, steps and benchmarks are keyed by date/id and can be re-added,
  // so their deletions carry a time: they only remove entries saved before it
  if (/^(w|b|s):/.test(key)) { const m = bkDelAt(); m[key] = Math.max(m[key] || 0, at || Date.now()); localStorage.setItem(BK_DEL_AT_KEY, JSON.stringify(m)); }
}
function bkUnforget(key) {
  localStorage.setItem(BK_DELETED_KEY, JSON.stringify(bkDeleted().filter(function(k){ return k !== key; })));
  const m = bkDelAt();
  if (key in m) { delete m[key]; localStorage.setItem(BK_DEL_AT_KEY, JSON.stringify(m)); }
}
const BK_DEL_AT_KEY = 'cleanslate_bk_deleted_at';
function bkDelAt() {
  const m = loadJSON(BK_DEL_AT_KEY) || {};
  // deletions recorded before deletion times existed apply to entries without a time
  bkDeleted().forEach(function(k){ if (/^(w|b|s):/.test(k) && !(k in m)) m[k] = 0; });
  return m;
}
function bkParse(rec) {
  const L = rec && rec.fields && rec.fields.Log;
  if (!L || !/"(rs|run|body|food|foodlib)"/.test(L)) return null;
  try {
    const o = JSON.parse(L);
    if (o && o.rs && o.rs.id) return { kind: 'rs', log: o.rs, recId: rec.id };
    if (o && o.run && o.run.id) return { kind: 'run', log: o.run, recId: rec.id };
    if (o && o.body) return { kind: 'body', body: o.body, recId: rec.id };
    if (o && o.food && o.food.date) return { kind: 'food', food: o.food, recId: rec.id };
    if (o && o.foodlib) return { kind: 'foodlib', foodlib: o.foodlib, recId: rec.id };
  } catch (e) {}
  return null;
}
function bkFields(kind, l) {
  if (kind === 'rs') return { Date: l.date, WorkoutName: 'Gym ' + l.session + ' · ' + (RS_SESSION_NAMES[l.session] || ''), Kind: 'lift', Log: JSON.stringify({ rs: l }) };
  return { Date: l.date, WorkoutName: (SLOT_INFO[l.slot] ? SLOT_INFO[l.slot].label : 'Run') + ' · Week ' + l.planWeek, Kind: 'cardio', Log: JSON.stringify({ run: l }) };
}
function byDateId(a, b) { return a.date < b.date ? -1 : a.date > b.date ? 1 : a.id - b.id; }
function bkRunStateIsDefault(st) {
  return st.start === RUN_PLAN_START && !st.repeats.length && !Object.keys(st.decisions).length && !Object.keys(st.swaps).length;
}
async function bkSync(remote) {
  const parsed = remote.map(bkParse).filter(Boolean);
  const deleted = bkDeleted();
  let sent = loadJSON(BK_SENT_KEY) || [], restored = 0;
  const remoteKeys = [];
  for (const kind of ['rs', 'run']) {
    const key = function(id){ return kind + ':' + id; };
    const storeKey = kind === 'rs' ? RS_LOGS_KEY : RUN_LOGS_KEY;
    const all = parsed.filter(function(r){ return r.kind === kind; });
    // deleted on this phone: remove the Airtable copy too
    for (const r of all.filter(function(r){ return deleted.indexOf(key(r.log.id)) >= 0; })) {
      await writeThrough('/sessions?records[]=' + r.recId, 'DELETE', null, true);
    }
    const rem = [], seen = {};
    all.forEach(function(r) {
      if (deleted.indexOf(key(r.log.id)) >= 0) return;
      if (seen[r.log.id]) { writeThrough('/sessions?records[]=' + r.recId, 'DELETE', null, true); return; }   // duplicate upload
      seen[r.log.id] = 1; rem.push(r); remoteKeys.push(key(r.log.id));
    });
    let local = loadJSON(storeKey) || [];
    const localIds = local.map(function(l){ return l.id; });
    const missing = rem.filter(function(r){ return localIds.indexOf(r.log.id) < 0; });
    if (missing.length) {
      local = local.concat(missing.map(function(r){ return r.log; })).sort(byDateId);
      localStorage.setItem(storeKey, JSON.stringify(local));
      restored += missing.length;
    }
    for (const r of rem) {
      const l = local.find(function(x){ return x.id === r.log.id; });
      if (l && JSON.stringify(l) !== JSON.stringify(r.log)) await writeThrough('/sessions', 'PATCH', { records: [{ id: r.recId, fields: bkFields(kind, l) }] }, true);
    }
    const toSend = local.filter(function(l){ return !seen[l.id] && sent.indexOf(key(l.id)) < 0; });
    for (const l of toSend) {
      sent.push(key(l.id));
      localStorage.setItem(BK_SENT_KEY, JSON.stringify(sent));
      await writeThrough('/sessions', 'POST', { records: [{ fields: bkFields(kind, l) }] }, true);
    }
  }
  // sent markers only matter until Airtable lists the record
  localStorage.setItem(BK_SENT_KEY, JSON.stringify(sent.filter(function(k){ return remoteKeys.indexOf(k) < 0; })));

  // weigh-ins + benchmarks (+ plan position) in one record
  const bodies = parsed.filter(function(r){ return r.kind === 'body'; });
  const rb = { weights: [], benchmarks: [], steps: [] };
  const delAt = bkDelAt();
  bodies.forEach(function(r) {
    // deletions made on other devices (weigh-ins, benchmarks, steps), with their times
    const m = r.body.deletedAt || {};
    Object.keys(m).forEach(function(k){ if (!(delAt[k] >= m[k])) delAt[k] = m[k]; });
    rb.weights = rb.weights.concat(r.body.weights || []);
    rb.steps = rb.steps.concat(r.body.steps || []);
    rb.benchmarks = rb.benchmarks.concat(r.body.benchmarks || []);
    if (r.body.runState && !rb.runState) rb.runState = r.body.runState;
    if (r.body.rsState && !rb.rsState) rb.rsState = r.body.rsState;
  });
  const wAt = function(w){ return w.at || 0; }, bAt = function(b){ return b.at || 0; };
  const dead = function(k, at){ return k in delAt && delAt[k] >= at; };
  // drop entries another device deleted after they were saved
  const ws0 = loadJSON(WEIGHT_KEY) || [], bs0 = benchmarks(), ss0 = loadJSON(STEPS_KEY) || [];
  const ws1 = ws0.filter(function(w){ return !dead('w:' + w.date, wAt(w)); }), bs1 = bs0.filter(function(b){ return !dead('b:' + b.id, bAt(b)); }), ss1 = ss0.filter(function(x){ return !dead('s:' + x.date, x.at || 0); });
  if (ws1.length !== ws0.length) localStorage.setItem(WEIGHT_KEY, JSON.stringify(ws1));
  if (bs1.length !== bs0.length) benchSave(bs1);
  if (ss1.length !== ss0.length) localStorage.setItem(STEPS_KEY, JSON.stringify(ss1));
  restored += (ws0.length - ws1.length) + (bs0.length - bs1.length) + (ss0.length - ss1.length);
  const ws = ws1, bs = bs1;
  const addB = [];
  let wChanged = 0;
  rb.weights.forEach(function(w) {
    if (dead('w:' + w.date, wAt(w))) return;
    const i = ws.findIndex(function(x){ return x.date === w.date; });
    if (i < 0) { ws.push(w); wChanged++; }
    else if (wAt(w) > wAt(ws[i])) { ws[i] = w; wChanged++; }
  });
  const bIds = bs.map(function(b){ return b.id; });
  rb.benchmarks.forEach(function(b){ if (bIds.indexOf(b.id) < 0 && !dead('b:' + b.id, bAt(b))) { bIds.push(b.id); addB.push(b); } });
  if (wChanged) localStorage.setItem(WEIGHT_KEY, JSON.stringify(ws));
  if (addB.length) benchSave(bs.concat(addB));
  restored += wChanged + addB.length;
  // steps: newer save wins for the same day
  const sl = stepsLog();
  let stepsChanged = 0;
  rb.steps.forEach(function(r) {
    if (dead('s:' + r.date, r.at || 0)) return;
    const i = sl.findIndex(function(x){ return x.date === r.date; });
    if (i < 0) { sl.push(r); stepsChanged++; }
    else if ((r.at || 0) > (sl[i].at || 0)) { sl[i] = r; stepsChanged++; }
  });
  if (stepsChanged) { localStorage.setItem(STEPS_KEY, JSON.stringify(sl)); restored += stepsChanged; }
  // keep the merged deletion times, minus any whose entry was saved again since
  weighIns().forEach(function(w){ if ('w:' + w.date in delAt && wAt(w) > delAt['w:' + w.date]) delete delAt['w:' + w.date]; });
  stepsLog().forEach(function(x){ if ('s:' + x.date in delAt && (x.at || 0) > delAt['s:' + x.date]) delete delAt['s:' + x.date]; });
  localStorage.setItem(BK_DEL_AT_KEY, JSON.stringify(delAt));
  // a phone with no plan history of its own takes Airtable's
  if (rb.runState && bkRunStateIsDefault(runState())) { runStateSave(rb.runState); if (!bkRunStateIsDefault(runState())) restored++; }
  if (rb.rsState && !localStorage.getItem(RS_STATE_KEY)) { RS = Object.assign(rsDefaultState(), rb.rsState); rsSave(); }
  const deletedAt = {};
  Object.keys(delAt).sort().forEach(function(k){ deletedAt[k] = delAt[k]; });
  const body = { weights: weighIns(), benchmarks: benchmarks(), runState: runState(), rsState: loadJSON(RS_STATE_KEY) || undefined, steps: stepsLog(), deletedAt: deletedAt };
  const same = bodies.length === 1 && JSON.stringify(bodies[0].body) === JSON.stringify(body);
  const empty = !body.weights.length && !body.benchmarks.length && !body.steps.length && !Object.keys(body.deletedAt).length && bkRunStateIsDefault(body.runState) && !body.rsState;
  if (!same && !(empty && !bodies.length)) {
    const fields = { Date: todayKey(), WorkoutName: 'Weigh-ins, steps, benchmarks & plan', Log: JSON.stringify({ body: body }) };
    if (bodies.length) {
      await writeThrough('/sessions', 'PATCH', { records: [{ id: bodies[0].recId, fields: fields }] }, true);
      for (const r of bodies.slice(1)) await writeThrough('/sessions?records[]=' + r.recId, 'DELETE', null, true);
    } else await writeThrough('/sessions', 'POST', { records: [{ fields: fields }] }, true);
  }
  restored += await bkFoodSync(parsed, deleted);
  localStorage.setItem(BK_LAST_KEY, new Date().toISOString());
  if (restored) toast('Restored ' + restored + ' item' + (restored === 1 ? '' : 's') + ' from Airtable');
  return restored;
}
// ── food in Airtable ────────────────────────────────────────
// One Sessions record per day of food (Log = {"food": {date, entries}}) –
// a single record would hit Airtable's 100,000-character limit – and one
// for the library and targets (Log = {"foodlib": {foods, meals, targets}}).
// Entries are never edited, only added or deleted, so a day merges as the
// union of both sides minus deletions. Foods and meals carry an `at` stamp
// set whenever they're saved; the newer copy wins. Targets likewise.
function byIdStr(a, b) { return a.id < b.id ? -1 : a.id > b.id ? 1 : 0; }
function foodLibTouched(lib, t, deleted) {
  return lib.foods.concat(lib.meals).some(function(x){ return x.at; }) || !!t.at ||
    deleted.some(function(k){ return k.indexOf('ff:') === 0 || k.indexOf('fm:') === 0; });
}
async function bkFoodSync(parsed, deleted) {
  let restored = 0;
  // Deletions travel in the records ("deleted" lists) so every device learns them.
  const forget = function(key){ if (deleted.indexOf(key) < 0) { deleted.push(key); bkForget(key); } };
  const isDel = function(e){ return deleted.indexOf('fe:' + e.id) >= 0; };
  // days
  const remoteDays = {};
  parsed.filter(function(r){ return r.kind === 'food'; }).forEach(function(r) {
    const d = r.food.date, es = r.food.entries || [], del = r.food.deleted || [];
    if (remoteDays[d]) { remoteDays[d].extra.push(r.recId); remoteDays[d].entries = remoteDays[d].entries.concat(es); remoteDays[d].del = remoteDays[d].del.concat(del); }
    else remoteDays[d] = { recId: r.recId, raw: es, rawDel: del, entries: es.slice(), del: del.slice(), extra: [] };
  });
  Object.keys(remoteDays).forEach(function(d){ remoteDays[d].del.forEach(function(id){ forget('fe:' + id); }); });
  let log = foodLog();
  const before = log.length;
  log = log.filter(function(e){ return !isDel(e); });
  if (log.length !== before) { localStorage.setItem(FOOD_LOG_KEY, JSON.stringify(log)); restored += before - log.length; }
  const byDate = {};
  log.forEach(function(e){ (byDate[e.date] = byDate[e.date] || []).push(e); });
  const dates = Object.keys(byDate).concat(Object.keys(remoteDays).filter(function(d){ return !byDate[d]; }));
  const added = [];
  for (const d of dates) {
    const rd = remoteDays[d], local = byDate[d] || [], have = {};
    local.forEach(function(e){ have[e.id] = 1; });
    (rd ? rd.entries : []).forEach(function(e){ if (!have[e.id] && !isDel(e)) { have[e.id] = 1; added.push(e); local.push(e); } });
    const merged = local.slice().sort(byIdStr);
    // tombstones: ids Airtable already lists as deleted, plus ids it still has that were deleted here
    const del = rd ? rd.del.concat(rd.entries.filter(isDel).map(function(e){ return e.id; })).filter(function(id, i, a){ return a.indexOf(id) === i; }).sort() : [];
    const fields = { Date: d, WorkoutName: 'Food · ' + fmtDay(d), Log: JSON.stringify({ food: { date: d, entries: merged, deleted: del } }) };
    if (rd) {
      if (rd.extra.length || JSON.stringify(rd.raw.slice().sort(byIdStr)) !== JSON.stringify(merged) || JSON.stringify(rd.rawDel.slice().sort()) !== JSON.stringify(del)) await writeThrough('/sessions', 'PATCH', { records: [{ id: rd.recId, fields: fields }] }, true);
      for (const id of rd.extra) await writeThrough('/sessions?records[]=' + id, 'DELETE', null, true);
    } else if (merged.length) await writeThrough('/sessions', 'POST', { records: [{ fields: fields }] }, true);
  }
  if (added.length) { localStorage.setItem(FOOD_LOG_KEY, JSON.stringify(log.concat(added))); restored += added.length; }

  // library + targets
  const libs = parsed.filter(function(r){ return r.kind === 'foodlib'; });
  const rlib = libs.length ? libs[0].foodlib : null;
  (rlib && rlib.deleted || []).forEach(forget);
  const lib = foodLib(), t = foodTargets();
  let changed = false;
  ['foods', 'meals'].forEach(function(k) {
    const n = lib[k].length, pre = k === 'foods' ? 'ff:' : 'fm:';
    lib[k] = lib[k].filter(function(x){ return deleted.indexOf(pre + x.id) < 0; });
    if (lib[k].length !== n) changed = true;
  });
  if (rlib) {
    const merge = function(local, remote, prefix) {
      (remote || []).forEach(function(r) {
        if (deleted.indexOf(prefix + r.id) >= 0) return;
        const i = local.findIndex(function(x){ return x.id === r.id; });
        if (i < 0) { local.push(r); changed = true; }
        else if ((r.at || 0) > (local[i].at || 0)) { local[i] = r; changed = true; }
      });
    };
    merge(lib.foods, rlib.foods, 'ff:');
    merge(lib.meals, rlib.meals, 'fm:');
    if (rlib.targets && (rlib.targets.at || 0) > (t.at || 0)) { localStorage.setItem(FOOD_TARGET_KEY, JSON.stringify(rlib.targets)); restored++; }
  }
  if (changed) { localStorage.setItem(FOOD_LIB_KEY, JSON.stringify(lib)); restored++; }
  const libDel = deleted.filter(function(k){ return k.indexOf('ff:') === 0 || k.indexOf('fm:') === 0; }).sort();
  const payload = { foods: lib.foods, meals: lib.meals, targets: foodTargets(), deleted: libDel };
  // the starting library alone isn't worth a record until something is changed
  if (rlib || foodLibTouched(lib, payload.targets, deleted)) {
    const fields = { Date: todayKey(), WorkoutName: 'Food library & targets', Log: JSON.stringify({ foodlib: payload }) };
    if (!rlib) await writeThrough('/sessions', 'POST', { records: [{ fields: fields }] }, true);
    else if (libs.length > 1 || JSON.stringify(rlib) !== JSON.stringify(payload)) {
      await writeThrough('/sessions', 'PATCH', { records: [{ id: libs[0].recId, fields: fields }] }, true);
      for (const r of libs.slice(1)) await writeThrough('/sessions?records[]=' + r.recId, 'DELETE', null, true);
    }
  }
  return restored;
}
// after any save or delete: sync in the background
function bkSoon() { setTimeout(function(){ rpSync(); }, 0); }
function bkStatus() {
  const n = rsLogs().length + runLogs().length, last = localStorage.getItem(BK_LAST_KEY);
  const pending = (loadJSON(BK_SENT_KEY) || []).length + JSON.parse(localStorage.getItem(QUEUE_KEY) || '[]').length;
  const days = {}; foodLog().forEach(function(e){ days[e.date] = 1; });
  const fd = Object.keys(days).length;
  return n + ' gym session' + (n === 1 ? '' : 's') + ' and runs, ' + fd + ' day' + (fd === 1 ? '' : 's') + ' of food on this phone' + (pending ? ' · ' + pending + ' waiting to upload' : '') +
    (last ? ' · checked ' + new Date(last).toLocaleString('en-AU', { day:'numeric', month:'short', hour:'2-digit', minute:'2-digit' }) : ' · not backed up yet');
}
// Ask the browser to keep this site's storage instead of clearing it when
// space runs low (Chrome grants this without a prompt for installed apps).
let storagePersisted = null;
function askPersist() {
  try {
    if (!navigator.storage || !navigator.storage.persist) return;
    navigator.storage.persisted().then(function(p) { return p || navigator.storage.persist(); })
      .then(function(p) { storagePersisted = !!p; const el = document.getElementById('persist-status'); if (el) el.textContent = persistLabel(); })
      .catch(function(){});
  } catch (e) {}
}
function persistLabel() {
  return storagePersisted === true ? 'Chrome is keeping this app\'s data (protected from automatic clean-up).'
    : storagePersisted === false ? 'Chrome may clear this app\'s data when space runs low – install it to the home screen to protect it. Airtable keeps a copy either way.' : '';
}

// ═══ BACKUP: JSON export / import ══════════════════════════
// Every cleanslate_* / cs3_* key except the sync key (a secret) and the
// one-off pre-migration copy. Import replaces this phone's data, then reloads
// so migrations run on whatever schema the file was written with.
function exportKeys() { return appKeys().filter(function(k){ return k !== SYNC_KEY_STORE && k !== PREMIGRATION_KEY; }); }
function backupHtml() {
  return '<button class="add-btn" onclick="exportData()">⇩ Export all data (JSON)</button>' +
    '<button class="add-btn" onclick="document.getElementById(\'import-file\').click()">⇧ Import from a JSON file</button>' +
    '<input id="import-file" type="file" accept="application/json,.json" style="display:none" onchange="importData(this)">' +
    '<div class="rp-line" style="text-align:center">Everything on this phone except the sync key. Keep a copy somewhere safe.</div>';
}
function exportData() {
  const data = {};
  exportKeys().forEach(function(k){ data[k] = localStorage.getItem(k); });
  const blob = new Blob([JSON.stringify({ app: 'clean-slate', schema: SCHEMA_VERSION, exportedAt: new Date().toISOString(), data: data }, null, 1)], { type: 'application/json' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'clean-slate-backup-' + todayKey() + '.json';
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(function(){ URL.revokeObjectURL(a.href); }, 5000);
  toast('Backup exported');
}
function importData(input) {
  const f = input.files && input.files[0];
  input.value = '';
  if (!f) return;
  const r = new FileReader();
  r.onload = function() {
    let o;
    try { o = JSON.parse(r.result); } catch (e) { toast('Not a valid backup file'); return; }
    if (!o || o.app !== 'clean-slate' || !o.data || typeof o.data !== 'object') { toast('Not a Clean Slate backup'); return; }
    if (!confirm('Replace all data on this phone with the backup from ' + (o.exportedAt ? new Date(o.exportedAt).toLocaleDateString('en-AU') : 'the file') + '?')) return;
    exportKeys().forEach(function(k){ localStorage.removeItem(k); });
    Object.keys(o.data).forEach(function(k) {
      if ((k.indexOf('cleanslate_') === 0 || k.indexOf('cs3_') === 0) && k !== SYNC_KEY_STORE && typeof o.data[k] === 'string') localStorage.setItem(k, o.data[k]);
    });
    if (!o.data[SCHEMA_KEY]) localStorage.removeItem(SCHEMA_KEY);
    location.reload();
  };
  r.readAsText(f);
}

// ═══ INIT ══════════════════════════════════════════════════
window.addEventListener('online', function(){ online = true; updateSyncDot(); flushQueue().then(function(){ rpSync(); }); });
window.addEventListener('offline', function(){ online = false; updateSyncDot(); });

if ('serviceWorker' in navigator) {
  window.addEventListener('load', function () {
    navigator.serviceWorker.register('service-worker.js').catch(function (e) {
      console.warn('Service worker registration failed', e);
    });
  });
}

(async function init() {
  askPersist();
  timerRestore();
  runRestore();
  const hadCache = cacheLoad();
  // RP Recomp and Run-Strength live in localStorage, so home can render without waiting on Airtable
  if (rpActive() || rsActive()) { nav('home'); loadAll(true).then(function(){ if (view === 'home' || view === 'manage') render(); }); return; }
  if (hadCache) { nav('home'); loadAll(true).then(function(){ if (view === 'home') render(); }); }
  else { await loadAll(); nav('home'); }
})();
</script>
